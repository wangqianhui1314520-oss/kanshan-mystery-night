services:
  - type: web
    name: kanshan-game
    runtime: docker
    # 注意：dockerfilePath 与 dockerContext 均相对【仓库根】解析，不是相对 dockerContext。
    # Dockerfile 实际位于 game/ 下，此前写作 ./Dockerfile 会导致 Render 找不到文件而构建失败。
    dockerfilePath: ./game/Dockerfile
    dockerContext: ./game
    healthCheckPath: /api/health
    numInstances: 1
    plan: starter
    disk:
      name: kanshan-data
      mountPath: /app/data
      sizeGB: 1
